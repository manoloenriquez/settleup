# Render Blueprint for the Talli API (apps/api): account closure only; AI runs on-device.
# The service keeps its original name (settleup-api): renaming it here would make
# Render create a second service instead of updating the existing one.
# Alternative to Railway — the same Dockerfile is used. Use the "starter" (paid)
# plan so the service does not spin down (free tier cold-starts ~30-60s).
services:
  - type: web
    name: settleup-api
    runtime: docker
    dockerfilePath: ./apps/api/Dockerfile
    dockerContext: .
    plan: starter
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      # Secrets — set these in the Render dashboard (sync:false keeps them out of the repo)
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: ALLOWED_ORIGINS
        sync: false
      - key: SENTRY_DSN
        sync: false
